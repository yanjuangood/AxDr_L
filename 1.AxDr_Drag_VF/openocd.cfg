# =============================================================================
#  OpenOCD 配置 — STM32G431RBTx + ST-Link
#
#  CLion 用法:
#    Run > Edit Configurations > + > OpenOCD Download & Run
#      Board config file : openocd.cfg   (本文件)
#      Executable        : AxDr.elf
#
#  命令行用法:
#    openocd -f openocd.cfg -c "program build/Debug/AxDr.elf verify reset exit"
#    openocd -f openocd.cfg -c "program build/Debug/AxDr.hex verify reset exit"
# =============================================================================

# --- 调试探针 ---
source [find interface/stlink.cfg]
transport select swd

# --- 目标芯片 ---
source [find target/stm32g4x.cfg]

# --- 速度 (kHz) ---
adapter speed 4000

# --- 复位方式 ---
# 注意: 不要写 "reset_config srst_only srst_nogate"!
# 这块板的 NRST 走线配合 ST-Link 用 srst_only 会报
#   "timed out while waiting for target halted / Unable to reset target"
# 用 OpenOCD 默认的复位配置即可。
# 如果确实需要, 可以试:
#   reset_config srst_only srst_nogate connect_assert_srst
